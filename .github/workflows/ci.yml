name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# PRs: one group per PR, newer pushes cancel older runs. Everything else: one group per
# event and commit, so a queued main run is never replaced by a newer one (every commit keeps
# its "CI OK" and :sha-<sha> image for the release gate and promote-on-tag).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: Web
    uses: seiunx-dev/ci-templates/.github/workflows/node-ci.yml@v1
    with:
      bun-version: 1.3.14 # 1.4.0 breaks the Playwright webServer on linux-x64; move to .bun-version
      install-command: bun install --frozen-lockfile --ignore-scripts
      # unit tests run once, with lcov for Sonar (sonar.yml used to rerun them)
      test-command: bun test --coverage --coverage-reporter=lcov --coverage-dir=coverage
      coverage-path: coverage/lcov.info
      e2e-command: bunx playwright test
      e2e-browsers: chromium

  sonar:
    name: Sonar
    needs: [web]
    uses: seiunx-dev/ci-templates/.github/workflows/sonar.yml@v1
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  workflows:
    name: Workflow lint
    uses: seiunx-dev/ci-templates/.github/workflows/actionlint.yml@v1

  ci-ok:
    name: CI OK # the only required status check
    if: always()
    needs: [web, sonar, workflows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
